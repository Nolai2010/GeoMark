<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
  <!-- 图10：黄金矩形 ABCD 与第一次折叠 -->
  <g transform="translate(30,40)">
    <rect x="0" y="0" width="485" height="300" fill="none" stroke="#2b2b2b" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="300" y2="300" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="7 5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#b54434" stroke-width="2"/>
    <circle cx="300" cy="0" r="4.5" fill="#2b2b2b"/>
