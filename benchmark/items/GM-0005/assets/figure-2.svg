<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
  <g transform="translate(10,10)">
    <!-- 图（1）作图结果：平行四边形 ABCD，O 为对角线交点 -->
    <path d="M 60 140 L 180 50 L 300 140 L 180 230 Z" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="60" y1="140" x2="300" y2="140" stroke="#2b2b2b" stroke-width="1.8"/>
    <line x1="180" y1="50" x2="180" y2="230" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 4"/>
    <circle cx="60" cy="140" r="4.5" fill="#2b2b2b"/>
    <circle cx="180" cy="50" r="4.5" fill="#2b2b2b"/>
    <circle cx="300" cy="140" r="4.5" fill="#2b2b2b"/>
    <circle cx="180" cy="230" r="4.5" fill="#8a8a8a"/>
    <circle cx="180" cy="140" r="4.5" fill="#b54434"/>
    <text x="32" y="148" font-size="24">A</text>
    <text x="172" y="34" font-size="24">B</text>
    <text x="310" y="148" font-size="24">C</text>
    <text x="172" y="256" font-size="24" fill="#8a8a8a">D</text>
    <text x="190" y="162" font-size="22" fill="#b54434">O</text>
    <text x="110" y="286" font-size="17" font-style="normal" fill="#666">尺规作图：作 B 关于 O 的对称点 D（虚线为痕迹）</text>
  </g>
</svg>
