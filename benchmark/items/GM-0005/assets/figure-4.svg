<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
  <g transform="translate(10,10)">
    <!-- 辅助圆：圆心 (140,165)，r=155.6；A(30,275) C(250,275) F(470,275) -->
    <circle cx="140" cy="165" r="155.6" fill="none" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="30" y1="275" x2="470" y2="275" stroke="#2b2b2b" stroke-width="2.2"/>
    <!-- generic E on upper arc, line EF meets circle again at G -->
    <line x1="62.2" y1="30.3" x2="470" y2="275" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="62.2" y1="30.3" x2="30" y2="275" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="62.2" y1="30.3" x2="250" y2="275" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="30" y1="275" x2="295.5" y2="170.3" stroke="#1f6f5c" stroke-width="2" stroke-dasharray="7 5"/>
    <!-- B (schematic position) -->
    <line x1="30" y1="275" x2="140" y2="205" stroke="#8a8a8a" stroke-width="1.6"/>
    <line x1="140" y1="205" x2="250" y2="275" stroke="#8a8a8a" stroke-width="1.6"/>
    <line x1="62.2" y1="30.3" x2="140" y2="205" stroke="#8a8a8a" stroke-width="1.6"/>
    <circle cx="30" cy="275" r="4.5" fill="#2b2b2b"/>
    <circle cx="250" cy="275" r="4.5" fill="#2b2b2b"/>
    <circle cx="470" cy="275" r="4.5" fill="#2b2b2b"/>
    <circle cx="140" cy="165" r="3.5" fill="#b54434"/>
    <circle cx="62.2" cy="30.3" r="4.5" fill="#2b2b2b"/>
    <circle cx="295.5" cy="170.3" r="4.5" fill="#1f6f5c"/>
    <circle cx="140" cy="205" r="4.5" fill="#8a8a8a"/>
    <text x="4" y="296" font-size="24">A</text>
    <text x="132" y="192" font-size="24" fill="#b54434">O′</text>
    <text x="244" y="296" font-size="24">C</text>
    <text x="478" y="296" font-size="24">F</text>
    <text x="44" y="26" font-size="24">E</text>
    <text x="306" y="168" font-size="24" fill="#1f6f5c">G</text>
    <text x="150" y="216" font-size="24" fill="#8a8a8a">B</text>
    <text x="180" y="344" font-size="17" font-style="normal" fill="#666">辅助圆：∠AEC = 45° ⇒ 弦 AC 对半径 2√2；G 为 EF 与圆的另一交点，AG 为弦</text>
  </g>
</svg>
