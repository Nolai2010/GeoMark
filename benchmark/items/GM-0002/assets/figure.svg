<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
  <!-- triangle ABC -->
  <path d="M 60 420 L 520 420 L 140 80 Z" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cevian AD (F on AD) -->
  <line x1="60" y1="420" x2="330" y2="250" stroke="#b54434" stroke-width="2.2"/>
  <!-- segment BE (F on BE) -->
  <line x1="113.3" y1="193.3" x2="520" y2="420" stroke="#1f6f5c" stroke-width="2.2"/>
  <!-- points -->
  <circle cx="113.3" cy="193.3" r="5" fill="#2b2b2b"/>
  <circle cx="330" cy="250" r="5" fill="#2b2b2b"/>
  <circle cx="276" cy="284" r="5" fill="#b54434"/>
  <circle cx="60" cy="420" r="5" fill="#2b2b2b"/>
  <circle cx="520" cy="420" r="5" fill="#2b2b2b"/>
  <circle cx="140" cy="80" r="5" fill="#2b2b2b"/>
  <!-- labels -->
  <text x="118" y="66" font-size="26" fill="#2b2b2b">C</text>
  <text x="38" y="446" font-size="26" fill="#2b2b2b">A</text>
  <text x="534" y="440" font-size="26" fill="#2b2b2b">B</text>
  <text x="80" y="196" font-size="26" fill="#2b2b2b">E</text>
  <text x="344" y="242" font-size="26" fill="#2b2b2b">D</text>
  <text x="262" y="318" font-size="26" fill="#b54434">F</text>
  <!-- annotations -->
  <text x="98" y="300" font-size="17" fill="#888" font-style="normal">E 在 AC 上，AE = 2EC</text>
  <text x="330" y="380" font-size="17" fill="#888" font-style="normal">D 为 BC 中点，F 在 AD 上，AF = 4/5 AD</text>
</svg>
